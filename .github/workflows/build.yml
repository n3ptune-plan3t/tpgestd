name: Build

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

permissions:
  contents: write   # needed to create/upload releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libinput-dev libudev-dev

      - name: Build tpgestd
        run: |
          gcc -O2 -o tpgestd tpgestd.c $(pkg-config --cflags --libs libinput libudev)

      - name: Smoke-check binary
        run: |
          file ./tpgestd
          ldd ./tpgestd || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tpgestd-linux-x86_64
          path: tpgestd
          if-no-files-found: error

      - name: Package release asset
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist
          cp tpgestd dist/
          cp README.md config.example tpgestd.service dist/ 2>/dev/null || true
          tar -C dist -czf tpgestd-${{ github.ref_name }}-linux-x86_64.tar.gz .

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tpgestd
            tpgestd-${{ github.ref_name }}-linux-x86_64.tar.gz
          generate_release_notes: true
